<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twgl.tree · toon</title>
<style>
  :root { color-scheme: dark }
  html, body { margin: 0; background: #0a0a0e; color: #e5e7eb; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace }
  main { display: flex; gap: 16px; flex-wrap: wrap; padding: 16px; align-items: flex-start }
  section { position: relative }
  h2 { font-size: 12px; font-weight: 600; margin: 0 0 6px; color: #9ca3af } h2 b { color: #f472b6 }
  canvas, iframe { display: block; box-shadow: 0 0 0 1px #1f2937; touch-action: none }
  iframe { width: 600px; height: 400px; border: 0 }
  .panel { position: absolute; left: 10px; top: 34px; display: grid; grid-template-columns: auto auto 2ch; gap: 2px 8px; align-items: center;
           color: #e8e8e8; background: #10131acc; padding: 6px 8px; border-radius: 6px }
  #note { padding: 0 16px 8px; color: #9ca3af }
  a.back { position: fixed; top: 12px; right: 14px; color: #9ca3af; text-decoration: none }
</style>
<script type="importmap">
{ "imports": {
  "twgl.js": "../node_modules/twgl.js/dist/7.x/twgl-full.module.js",
  "twgl.tree": "../dist/index.js",
  "@nakednous/tree": "../node_modules/@nakednous/tree/dist/index.js",
  "@nakednous/host": "../node_modules/@nakednous/host/dist/index.js"
} }
</script>
</head>
<body>
<a class="back" href="index.html">← harness</a>
<div id="note">the cursor aims the light · drag orbits, the wheel dollies · the fields are random on each side, so compare the banding, not the layout</div>
<main>
  <section>
    <h2><b>twgl.tree</b> · toon.vert / toon.frag over twgl.primitives</h2>
    <canvas id="gl" width="600" height="400"></canvas>
    <div class="panel">
      <label for="shades">shades</label><input id="shades" type="range" min="1" max="10" step="1" value="5"><output id="shadesOut">5</output>
      <label for="tint">tint</label><input id="tint" type="color" value="#ffd700"><span></span>
      <label for="count">models</label><input id="count" type="range" min="1" max="100" step="1" value="50"><output id="countOut">50</output>
    </div>
  </section>
  <section><h2><b>notebook</b> · static/sketches/toon.js on p5.tree</h2><iframe src="nb-toon.html" title="the notebook's toon.js"></iframe></section>
</main>

<!-- static/shaders/toon.vert and toon.frag, verbatim -->
<script id="toon-vert" type="x-shader">#version 300 es
precision highp float;

in vec4 aPosition;
in vec3 aNormal;

uniform mat4 uProjectionMatrix;
uniform mat4 uModelViewMatrix;
uniform mat3 uNormalMatrix;

out vec3 vNormal;

void main() {
  vNormal = normalize(uNormalMatrix * aNormal);
  gl_Position = uProjectionMatrix * uModelViewMatrix * aPosition;
}</script>
<script id="toon-frag" type="x-shader">#version 300 es
precision highp float;

in vec3 vNormal;

uniform vec3  uLightDir;   // eye space — the cursor aims it
uniform float uShades;     // how many bands the cosine collapses into
uniform vec3  uTintCol;    // the bands' tint
uniform vec3  uColor;      // per-primitive surface color

out vec4 outColor;

void main() {
  float intensity = max(0.0, dot(normalize(vNormal), normalize(uLightDir)));
  float shadeSize = 1.0 / clamp(uShades, 1.0, 10.0);
  float k         = floor(intensity / shadeSize) * shadeSize;
  k = max(k, shadeSize * 0.5);
  outColor = vec4(k * uTintCol * uColor, 1.0);
}</script>

<script type="module">
// The notebook's toon hero on the bridge. toon.vert declares uModelViewMatrix,
// uProjectionMatrix and uNormalMatrix, so draw uploads exactly those; the light
// direction, the bands, the tint and each primitive's colour are the hero's own
// uniforms. The shapes are twgl.primitives, unit-sized and scaled per model the
// way p5's cone(r), sphere(r) and torus(r, r / 4) size them.
import * as twgl from 'twgl.js'
import { init, setCamera, bind, draw, axes, grid, tree, host } from 'twgl.tree'

const $ = (id) => document.getElementById(id)
const src = (id) => $(id).textContent
const canvas = $('gl')
const gl = canvas.getContext('webgl2', { antialias: true })
const canvasHost = host.createHost(canvas)
init(gl, { host: canvasHost })

const toon = twgl.createProgramInfo(gl, [src('toon-vert'), src('toon-frag')])
// twgl's primitives name their arrays position / normal; toon.vert declares aPosition / aNormal
const buffer = (v) => twgl.createBufferInfoFromArrays(gl, { aPosition: v.position, aNormal: v.normal, indices: v.indices })
const shapes = [
  buffer(twgl.primitives.createTruncatedConeVertices(1, 0, 1, 24, 1, true, true)),   // cone(r): radius r, height r
  buffer(twgl.primitives.createSphereVertices(1, 24, 16)),                           // sphere(r)
  buffer(twgl.primitives.createTorusVertices(1, 0.25, 24, 16)),                      // torus(r, r / 4)
]

// the field: 100 primitives, random position, axis-angle, size and colour
const TRANGE = 200
const rnd = () => Math.random() * 2 - 1
const models = []
for (let i = 0; i < 100; i++) {
  const z = rnd(), phi = Math.random() * 2 * Math.PI, s = Math.sqrt(1 - z * z)
  const q = tree.qFromAxisAngle([0, 0, 0, 1], s * Math.cos(phi), s * Math.sin(phi), z, Math.random() * 2 * Math.PI)
  const r = (Math.random() * 50 + 16) / 2
  models.push({
    shape: shapes[i % 3],
    color: [Math.random(), Math.random(), Math.random()],
    M: tree.mat4FromTRS(new Float32Array(16), rnd() * TRANGE, rnd() * TRANGE, rnd() * TRANGE, q[0], q[1], q[2], q[3], r, r, r),
  })
}

// p5's default camera: eye 800 out, fov 2 · atan(height / 2 / 800), near 80, far 8000
const cam = tree.createCamera({ eye: [0, 0, 800], fov: 2 * Math.atan(200 / 800), near: 80, far: 8000 })
const orbit = canvasHost.orbit(cam)

let mx = 0, my = 0
canvas.addEventListener('pointermove', (e) => { mx = e.offsetX; my = e.offsetY })
$('shades').oninput = () => { $('shadesOut').value = $('shades').value }
$('count').oninput = () => { $('countOut').value = $('count').value }
const hexToRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255)

const BG = [0x10 / 255, 0x13 / 255, 0x1a / 255]          // the notebook's dark ground
const GRID = [0x3e / 255, 0x3e / 255, 0x42 / 255, 1]
const light = [0, 0, 0]

function render() {
  twgl.bindFramebufferInfo(gl, null)
  gl.enable(gl.DEPTH_TEST)
  gl.clearColor(BG[0], BG[1], BG[2], 1)
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT)
  setCamera(gl, cam)
  if (orbit.update()) setCamera(gl, cam)

  axes(gl, { size: 175 })
  grid(gl, { size: 175, color: GRID })

  // the cursor aims the light in eye space; screen y runs down, the eye's y up
  const lx = (mx / canvas.width - 0.5) * 2
  const ly = -(my / canvas.height - 0.5) * 2
  const lz = 0.4
  const len = Math.hypot(lx, ly, lz)
  light[0] = lx / len; light[1] = ly / len; light[2] = lz / len

  bind(gl, toon, { uLightDir: light, uShades: +$('shades').value, uTintCol: hexToRgb($('tint').value) })
  const n = +$('count').value
  for (let i = 0; i < n; i++) {
    twgl.setUniforms(toon, { uColor: models[i].color })
    draw(gl, models[i].shape, models[i].M)
  }

  canvasHost.pointer.flush()
  requestAnimationFrame(render)
}
requestAnimationFrame(render)
</script>
</body>
</html>
