<main>

<!-- SHADOW_VERT from static/sketches/helpers/shadow.js, verbatim -->
<script id="shadow-vert" type="x-shader">#version 300 es
precision highp float;

in vec4 aPosition;
in vec3 aNormal;
uniform mat4 uProjectionMatrix;
uniform mat4 uModelMatrix;
uniform mat4 uViewMatrix;
uniform mat3 uNormalMatrix;

// custom
// transforms from world to (biased) light clip space
uniform mat4 uWorldLightMatrix;
// light position in eye space
uniform vec3 uLightPosition;

out vec3 vNormal;
out vec3 vLightDir;
out vec4 vLightClip4;

void main() {
  // normal vector in eye space
  vNormal = normalize(uNormalMatrix * aNormal);
  // local to world transform
  vec4 wPosition4 = uModelMatrix * aPosition;
  // world to light transform
  vLightClip4 = uWorldLightMatrix * wPosition4;
  // world to eye transform
  vec4 ePosition4 = uViewMatrix * wPosition4;
  // light direction in eye space
  vLightDir = normalize(uLightPosition - ePosition4.xyz);
  // eye to clip space transform
  gl_Position = uProjectionMatrix * ePosition4;
}</script>
<!-- static/shaders/shadow.frag, verbatim (uMaterialColor is set per object here, where p5's fill() pushes it) -->
<script id="shadow-frag" type="x-shader">#version 300 es
precision highp float;

uniform sampler2D uDepth;
uniform float uAmbient;
uniform vec4 uMaterialColor;

in vec3 vNormal;
in vec3 vLightDir;
in vec4 vLightClip4;

out vec4 outColor;

const float BIAS   = 0.0035;   // depth epsilon against acne
const float SHADOW = 0.4;      // shadowed diffuse floor

float visibility(vec4 clip4) {
  // perspective divide → biased light clip space, xyz in [0,1] inside the beam
  vec3 l = clip4.xyz / clip4.w;
  // outside the light's beam volume there is no depth information — keep lit
  if (any(lessThan(l, vec3(0.0))) || any(greaterThan(l, vec3(1.0)))) return 1.0;
  float current = l.z - BIAS;
  // 3×3 PCF — average the compare, not the depth
  vec2 texel = 1.0 / vec2(textureSize(uDepth, 0));
  float lit = 0.0;
  for (int i = -1; i <= 1; i++)
    for (int j = -1; j <= 1; j++)
      lit += current < texture(uDepth, l.xy + vec2(i, j) * texel).r ? 1.0 : 0.0;
  return mix(SHADOW, 1.0, lit / 9.0);
}

void main() {
  float diffuse = max(0.0, dot(vLightDir, vNormal));
  outColor = vec4((uAmbient + visibility(vLightClip4) * diffuse) * uMaterialColor.rgb,
                  uMaterialColor.a);
}</script>
<!-- depthProg: positions only, a flat colour (the light marker reuses it) -->
<script id="depth-vert" type="x-shader">#version 300 es
in vec4 aPosition;
uniform mat4 uModelViewProjectionMatrix;
void main() {
  gl_Position = uModelViewProjectionMatrix * aPosition;
}</script>
<script id="depth-frag" type="x-shader">#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 outColor;
void main() {
  outColor = uColor;
}</script>

<script type="module">
// The notebook's shadow_mapping hero on the bridge, render() written as the
// Shadows chapter's pseudo-code: each notation line is one bridge or twgl call,
// commented with the symbol it realizes. shadow.vert declares uModelMatrix,
// uViewMatrix, uProjectionMatrix and uNormalMatrix, so draw uploads those; the
// names bind lists are the hero's own uniforms.
// The notebook's world is p5's y-down one; every y below is negated.
import * as twgl from 'twgl.js'
import { init, setCamera, bind, draw, renderTarget, viewOf, SCREEN, tree, host } from 'twgl.tree'

const $ = (id) => document.getElementById(id)
const canvas = $('gl')
const gl = canvas.getContext('webgl2', { antialias: true })
const canvasHost = host.createHost(canvas)
init(gl, { host: canvasHost })
gl.enable(gl.DEPTH_TEST)                                  // p5 has it on silently; the notation never writes it

// twgl reads a shader from the <script> whose id it is given
const shadowProg = twgl.createProgramInfo(gl, ['shadow-vert', 'shadow-frag'])
const depthProg = twgl.createProgramInfo(gl, ['depth-vert', 'depth-frag'])
// twgl's primitives name their arrays position / normal; the shaders declare aPosition / aNormal
const buffer = (v) => twgl.createBufferInfoFromArrays(gl, { aPosition: v.position, aNormal: v.normal, indices: v.indices })
const cube = buffer(twgl.primitives.createCubeVertices(1))                          // box(w, h, d) scales it
const ball = buffer(twgl.primitives.createSphereVertices(1, 24, 16))                // sphere(r)
const column = buffer(twgl.primitives.createCylinderVertices(1, 1, 24, 1, true, true))   // cylinder(r, h)
const ring = buffer(twgl.primitives.createTorusVertices(35, 8, 24, 16))            // torus(35, 8)

// ── the landscapes: each frame writes { buf, rgba, M } into reused slots ──────
const items = []
let used = 0
function put(buf, rgba, tx, ty, tz, sx, sy, sz) {
  const it = items[used] || (items[used] = { M: new Float32Array(16) })
  it.buf = buf
  it.rgba = rgba
  tree.mat4FromTRS(it.M, tx, ty, tz, 0, 0, 0, 1, sx, sy, sz)
  used++
  return it
}

const TWO_PI = 2 * Math.PI
const ORANGE = [1, 0.333, 0, 1], BLUE = [0, 0.333, 1, 1]
const GREEN = [0, 0.8, 0.4, 1], AMBER = [0.9, 0.6, 0, 1], SKY = [0.2, 0.4, 1, 1]
const PINK = [0.8, 0.2, 0.6, 1], GOLD = [1, 0.8, 0.1, 1]
const Rx = new Float32Array(16), Ry = new Float32Array(16), qx = [0, 0, 0, 1], qy = [0, 0, 0, 1]

function landscape(i, f) {
  used = 0
  if (i === 2) {
    // concentric towers at two radii + central cylinder
    for (let n = 0; n < 8; n++) {
      const a = TWO_PI * n / 8 + f * 0.002
      put(cube, GREEN, Math.sin(a) * 40, 0, Math.cos(a) * 40, 12, 70, 12)
    }
    for (let n = 0; n < 16; n++) {
      const a = TWO_PI * n / 16 - f * 0.001
      put(cube, AMBER, Math.sin(a) * 80, -Math.cos(a * 3) * 8, Math.cos(a) * 80, 8, 50, 8)
    }
    put(column, SKY, 0, 0, 0, 20, 80, 20)
  } else if (i === 3) {
    // grid of pillars + rotating torus; p5's noise() has no counterpart here, two slow sines stand in
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const h = 20 + 60 * (0.5 + 0.25 * (Math.sin(r * 1.7 + f * 0.006) + Math.sin(c * 1.3 + 1.9 + f * 0.004)))
        put(cube, PINK, r * 36 - 72, 0, c * 36 - 72, 14, h, 14)
      }
    }
    const t = put(ring, GOLD, 0, 0, 0, 1, 1, 1)
    tree.qFromAxisAngle(qx, 1, 0, 0, f * 0.008)
    tree.qFromAxisAngle(qy, 0, 1, 0, f * 0.005)
    tree.mat4FromTRS(Rx, 0, 0, 0, qx[0], qx[1], qx[2], qx[3], 1, 1, 1)
    tree.mat4FromTRS(Ry, 0, 0, 0, qy[0], qy[1], qy[2], qy[3], 1, 1, 1)
    tree.mat4Mul(t.M, Rx, Ry)                             // rotateX then rotateY, as the sketch applies them
  } else {
    // ring of boxes + central sphere
    let a = -f * 0.0015
    for (let n = 0; n < 20; n++, a += TWO_PI / 20) {
      put(cube, ORANGE, Math.sin(a) * 70, -Math.cos(a * 4) * 10, Math.cos(a) * 70, 10, 100, 10)
    }
    put(ball, BLUE, 0, 0, 0, 50, 50, 50)
  }
}

// scene(): the landscape under the bound program; each object's colour is what p5's fill() supplies
function scene(prog) {
  for (let i = 0; i < used; i++) {
    twgl.setUniforms(prog, { uMaterialColor: items[i].rgba })
    draw(gl, items[i].buf, items[i].M)
  }
}

// ── init: cameras, the target, the compare's matrices ─────────────────────────
// the sketch's perspective(2 · atan(height / 2 / 800), 1, 80, 8000) and home eye, y negated
const cam = tree.createCamera({ eye: [0, 200, 400], fov: 2 * Math.atan(250 / 800), near: 80, far: 8000 })
const orbit = canvasHost.orbit(cam)
// the light: ortho(-110, 110, -110, 110, 110, 350) looking at the origin
const lightCam = tree.createCamera({ eye: [0, 160, 160], halfHeight: 110, near: 110, far: 350 })
const lightPosition = lightCam.eye
const depthFBO = renderTarget(gl, { depth: true })        // renderTarget(depth)

const B = new Float32Array([0.5, 0, 0, 0, 0, 0.5, 0, 0, 0, 0, 0.5, 0, 0.5, 0.5, 0.5, 1])   // NDC → texture, column-major
const V_light = new Float32Array(16), P_light = new Float32Array(16), PV_light = new Float32Array(16)
const uWorldLightMatrix = new Float32Array(16)
const uLightPosition = [0, 0, 0]
const uDepth = depthFBO.depth
const bulbM = new Float32Array(16)
const BG = [0x10 / 255, 0x13 / 255, 0x1a / 255]          // the notebook's dark ground
const BULB = [1, 0xe0 / 255, 0x66 / 255, 1]               // its dark palette's yellow

$('ambient').oninput = () => { $('ambientOut').value = $('ambient').value }
let step = 0, frame = 0

function render() {
  frame++
  if ($('animate').checked) step++
  lightPosition[0] = Math.sin(step * 0.002) * 160
  lightPosition[2] = Math.cos(step * 0.002) * 160
  landscape(+$('scene').value, frame)
  tree.cameraView(V_light, lightCam)
  tree.cameraProj(P_light, lightCam, 1, tree.WEBGL)
  const uAmbient = +$('ambient').value

  // 1 — depth pass: photograph the scene from the light's frame
  twgl.bindFramebufferInfo(gl, depthFBO)                  // beginPass(depthFBO)
  gl.clear(gl.DEPTH_BUFFER_BIT)                           // clear()
  bind(gl, depthProg)                                     // positions only
  setCamera(gl, V_light, P_light)                         // orthographic, from the light
  scene(depthProg)

  // 2 — main pass: reexpress each fragment in the light's biased clip space
  twgl.bindFramebufferInfo(gl, SCREEN)                    // beginPass(screen)
  gl.clearColor(BG[0], BG[1], BG[2], 1)
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT)     // clear()
  setCamera(gl, cam)
  if (orbit.update()) setCamera(gl, cam)                  // interact()
  tree.mat4Mul(PV_light, P_light, V_light)
  tree.mat4Mul(uWorldLightMatrix, B, PV_light)            // uWorldLightMatrix = B · P_light · V_light
  // WORLD → EYE
  tree.mat4MulPoint(uLightPosition, viewOf(gl).mat4View,
    lightPosition[0], lightPosition[1], lightPosition[2]) // uLightPosition = V · lightPosition
  bind(gl, shadowProg, { uWorldLightMatrix, uLightPosition, uDepth, uAmbient })
  scene(shadowProg)

  // the light marker
  bind(gl, depthProg, { uColor: BULB })
  draw(gl, ball, tree.mat4FromTRS(bulbM, lightPosition[0], lightPosition[1], lightPosition[2], 0, 0, 0, 1, 5, 5, 5))

  canvasHost.pointer.flush()
  requestAnimationFrame(render)
}
requestAnimationFrame(render)
</script>
</body>
